services:
  postgres:
    image: postgres:18.6 # имя образа
    container_name: db # название контейнера, можно придумать любое
    environment:
      POSTGRES_DB: "demo" # название БД, не менять!
      POSTGRES_USER: "postgres" # имя пользователя, можно придумать любое
      POSTGRES_PASSWORD: "postgres" # пароль пользователя, можно придумать любой
    volumes:
      # вместо C:\database\demo подставить свой путь
      - /usr/docker/demo
    ports:
      - "5433:5432" # порт 5433 указан на случай, если порт 5432 занят другим контейнером БД
    restart: always # если нужен автоматический старт контейнера при вкл компьютера, или рестарт при ошибке
